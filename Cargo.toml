# an app using the expo/exact source checkout at ../expo-exact.
# build profiles are injected by the framework; the patches
# below are generated by `exact new` and checked on every run.
[workspace]
members = ["apple", "linux", "web"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[patch.crates-io]
accesskit_windows = { path = "../expo-exact/vendor/accesskit-windows" }
taffy = { path = "../expo-exact/vendor/taffy" }
parley = { path = "../expo-exact/vendor/parley" }
fontique = { path = "../expo-exact/vendor/fontique" }
wgpu-hal = { path = "../expo-exact/vendor/wgpu-hal" }
