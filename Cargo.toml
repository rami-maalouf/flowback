# Exact Cover: an Exact2 app outside the exact2 checkout, which it uses by path
# (../exact2). Build profiles are injected by exact2's scripts; the patches
# below are generated by `exact new` and checked on every run.
[workspace]
members = ["apple", "linux", "web"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[patch.crates-io]
taffy = { path = "../exact2/vendor/taffy" }
parley = { path = "../exact2/vendor/parley" }
fontique = { path = "../exact2/vendor/fontique" }
wgpu-hal = { path = "../exact2/vendor/wgpu-hal" }
