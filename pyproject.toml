[project]
name = "exact-cover-engine"
version = "0.1.0"
description = "align a supplied vocal performance to its original song"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "numpy>=1.26,<3",
  "soundfile>=0.13,<1",
  "pedalboard>=0.9.22,<1",
  "yt-dlp[default]>=2025.1.1",
]

[project.optional-dependencies]
models = [
    "audio-separator[cpu]>=0.40",
    "audioread>=3.1.0",
    "av>=11,<17",
    "faster-whisper>=1.2,<2",
    "librosa>=0.10,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

